<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Odin Sign-up Form</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div class="splash">
            <div class="title">
                <img src="images/odin-lined.png" alt="A cute little viking">
                <h1>ODIN</h1>
            </div>
            <p class="photo-creds">
                Photo by 
                <a href="https://unsplash.com/@haliewestphoto">Halie West</a> 
                on <a href="https://unsplash.com">Unsplash</a>
            </p>
        </div>
        <div class="content">
            <h2>
                This is not a real online service!
                You know you need something like this in your life
                to help you realize your deepest dreams.
                Sign up <em>now</em> to get started.
            </h2>
            <h2>You <em>know</em> you want to.</h2>
            <form id="sign-up-form">
                <legend>Let's do this!</legend>
                <div class="form-row">
                    <label for="first-name">FIRST NAME</label>
                    <input type="text" id="first-name" name="first-name">

                    <label for="last-name">LAST NAME</label>
                    <input type="text" id="last-name" name="last-name">
                </div>
                <div class="form-row">
                    <label for="email">EMAIL</label>
                    <input type="email" id="email" name="email">

                    <label for="phone-number">PHONE NUMBER</label>
                    <input type="tel" id="phone-number" name="phone-number">
                </div>
                <div class="form-row">
                    <label for="password">PASSWORD</label>
                    <input type="password" id="password" name="password">

                    <label for="confirm-password">CONFIRM PASSWORD</label>
                    <input type="password" id="confirm-password" name="confirm-password">
                </div>
            </form>
            <button type="submit" form="sign-up-form">Create Account</button>
            <p class="existing-account">Already have an account? <a href="">Log in</a></p>
        </div>
    </body>
</html>
